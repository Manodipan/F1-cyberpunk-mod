# ============================================================
# CHASSIS DYNAMICS - Tires / Suspension / Dampers / Anti-Roll Bars
# ============================================================
# Front axle: V-Tech stock values, edit one group at a time.
Vehicle.turbor_afterburn_chassis_front:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech_inline1
  # Tire grip and rolling resistance
  # Front axle - 375 mm
  frictionMulLateral: 0.924324   # Michelin Pilot Sport 4 S Weeeee!
  frictionMulLongitudinal: 1.029405
  tireFrictionCoef: 1.0
  tireLateralSlipEffectsMul: 0.8
  tireLongitudinalSlipEffectsMul: 1.0
  tireRollingResistanceCoef: 0.00886000 

  # Springs / dampers / anti-roll bars
  # And a little "deja vu at 200 mph" touch?
  springStiffness: 27.13    # 66.76 N/mm   # 9,674 N·s/m     # lb/mm. WTF, CDPR?! ARE YOU GUYS EVEN HUMAN?! DO YOU HAVE ANY IDEA HOW MANY HOURS I SPENT TRYING TO FIGURE THIS SHIT OUT?! TFFFFFFFFFFFFFFFF!!!!    # Edit: I'm not even mad anymore. This isn't even a real-world measurement. I was wrong, okay? I'm not even mad anymore. I'm just trying to make sense of this shit. Sorry, CDPR. I guess.
  springDamping: 1935   # Coz Nvidia's PhysX says so... (I think I got it right this time. I hope I did.)
  springReboundDamping: 4451    # 2.3:1 Stop bouncing people into cyberpsychosis.
  springBoundDampingLowRate: 1505
  springReboundDampingLowRate: 3010
  springDampingHighRateCompression: 0.40
  springDampingLowRateCompression: 0.24
  swaybarStiffness: 12.24   # 4G7Z-5482-AA
  swaybarLengthScalar: 1.30   # Ghidra was involved. I don't wanna talk about it.
  swaybarDisplacementLimit: 0.15
  tenderSpringLength: 0

  # Braking and suspension travel
  maxBrakingTorque: 1203
  logicalSuspensionCompressionLength: 0.3504
  visualSuspensionCompressionLength: 0.055
  visualSuspensionDroop: 0.056  # 19.05 mm
  wheelsVerticalOffset: 0.01
  mass: 23.4
  extremeCompressionEventScalor: 0.70

# Rear axle: 645 mm (spring/comp damping only) anti-squat support 
Vehicle.turbor_afterburn_chassis_rear:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech_inline2
  # Tire grip and rolling resistance
  # Rear axle - 645 mm
  frictionMulLateral: 0.975676
  frictionMulLongitudinal: 1.086595    # Tires: SKRRRRRRRRRRRT!!!
  tireFrictionCoef: 1.0
  tireLateralSlipEffectsMul: 1.0
  tireLongitudinalSlipEffectsMul: 1.66
  tireRollingResistanceCoef: 0.00906402
  
  # Springs / dampers / anti-roll bars
  # 92 years later, A Ferrari Slayer rises once more in Detroit?
  springStiffness: 33.99   # SO.. If I am right, and at least I think I am, this should be 76.47 N/mm   #12,167 N·s/m
  springDamping: 2433
  springReboundDamping: 5597
  springBoundDampingLowRate: 1846
  springReboundDampingLowRate: 3425
  springDampingHighRateCompression: 0.40
  springDampingLowRateCompression: 0.24
  swaybarStiffness: 11.28   # 4G7Z-5A772-AA
  swaybarLengthScalar: 0.90
  swaybarDisplacementLimit: 0.15
  tenderSpringLength: 0
  
  # Braking and suspension travel
  maxBrakingTorque: 802
  logicalSuspensionCompressionLength: 0.3765
  visualSuspensionCompressionLength: 0.070
  visualSuspensionDroop: 0.068
  wheelsVerticalOffset: 0.01
  mass: 38.4
  extremeCompressionEventScalor: 0.70

# Exact V-Tech tire geometry; separate records keep the original car untouched.
# The original player vehicle points to private wheel records.
Vehicle.turbor_afterburn_wheel_dimensions:
  $type: gamedataVehicleWheelDimensionsSetup_Record
  frontPreset: Vehicle.turbor_afterburn_wheel_front
  backPreset: Vehicle.turbor_afterburn_wheel_rear

#  Front: 375 mm width / 700 mm overall diameter / 21-inch rim
Vehicle.turbor_afterburn_wheel_front:
  $type: gamedataVehicleWheelDimensionsPreset_Record
  rimRadius: 0.2667
  tireRadius: 0.3500
  tireWidth: 0.375   # Defeat value: 0.270 (ahhhhhhh my eyes! CDPR, why do you keep using 270 mm for the front tire width? The real-world equivalent is 275 mm. I can't leave it at 0.270 because the tire geometry IRL is 275 mm.) edit: nvm, Blender says it's actually 375 mm.
  wheelOffset: 0.079245   # 7.9245% rear wheel offset. why? coz the rear wheels protrude noticeably farther outward than the front wheels. I tested it and it finally has the correct rear tire collision geometry (I finally found it!)

#  Rear: 645 mm MEASURED! tread width / 758 mm overall diameter / 22-inch rim
Vehicle.turbor_afterburn_wheel_rear:
  $type: gamedataVehicleWheelDimensionsPreset_Record
  rimRadius: 0.2794
  tireRadius: 0.3790
  tireWidth: 0.645    # Rear tire width is 500 mm by default. Just when I thought things couldn't get any crazier...
  wheelOffset: 0.10


# ============================================================
# AERODYNAMICS - Air Resistance / Downforce / Lift
# ============================================================
# AFTERBURN - private in-air gravity modifier.
# Original Turbo-R V-Tech: driveSpeedAddedGravity: 0.200000003
Vehicle.turbor_afterburn_in_air_gravity:
  $type: gamedataInAirGravityModifier_Record
  type: Vehicle.InAirGravityModifier_HelperType
  baseAddedGravity: 0.4
  smoothingFactor: 0.2
  driveSpeedAddedGravity: 0.223   # So many... apples... woaaahhh... the gravity... dude... WOOOAAAH
  maxDriveSpeed: 20
  minDriveSpeed: 3
  zVelReductionStart: -2
  zVelReductionEnd: -10

# AFTERBURN - Mild Dynamic Downforce
Vehicle.turbor_afterburn_dynamic_downforce:
  $type: gamedataDynamicDownforceHelper_Record
  type: Vehicle.DynamicDownforceHelper_HelperType
  minSpeed: 10
  maxSpeed: 58.5
  maxSpeedFactorGround: -0.05655   # An apple a day keeps the traction away.
  maxSpeedFactorAir: 0.025


# ============================================================
# MISCELLANEOUS - Vehicle Health
# ============================================================

# AFTERBURN-only +50% Health (Okay, this is straight-up cheating. WTF am I doing? People are NOT gonna like this.).
# Multiplier 1.5 applies to BaseStats.Health; this does not affect body deformation visuals.
Vehicle.turbor_afterburn_health_x15:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.Health
  modifierType: Multiplier
  value: 1.5