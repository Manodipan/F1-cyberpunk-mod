# Quadra Turbo-R V-Tech AFTERBURN
# THIS IS A WORK OF FICTION.
#
# Any resemblance to actual Italian supercars,
# living or dead, is entirely intentional.
#
# Apparently, the paperwork made it from
# Maranello to Dearborn after all.
#
# No Ferraris were harmed in the making of this car.
# Allegedly.
# ============================================================
# VEHICLE CONFIGURATION - Identity / Appearance / References
# ============================================================
Vehicle.v_sport1_quadra_turbo_r_player:
  vehDriveModelData: Vehicle.turbor_afterburn_drive_model
  vehEngineData: Vehicle.turbor_afterburn_engine
  # AFTERBURN-Only health multiplier; leaves inherited vehicle stat groups intact.
  statModifiers:
    - !append-once Vehicle.turbor_afterburn_health_x15

# Wheel Dimensions & Camber
  vehWheelDimensionsSetup: Vehicle.turbor_afterburn_wheel_dimensions
  leftFrontCamber: 1.36   # RT-2!
  rightFrontCamber: -1.36
  leftBackCamber: 2.43
  rightBackCamber: -2.43
  leftFrontCamberOffset: {x: 0.01, y: 0, z: 0}
  rightFrontCamberOffset: {x: -0.01, y: 0, z: 0}
  leftBackCamberOffset: {x: 0.02, y: 0, z: 0}
  rightBackCamberOffset: {x: -0.02, y: 0, z: 0}


# ============================================================
# VEHICLE DYNAMICS - Mass / Handling / Steering / Braking
# ============================================================
Vehicle.turbor_afterburn_drive_model:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech
  # AFTERBURN exclusive in-air gravity helper.
  # Replace the inherited V-Tech helper IN PLACE (do not append a second one).
  # Original V-Tech helper order retained, with RotationLimiter removed.
  driveHelpers:
    - Vehicle.turbor_afterburn_rear_friction
    - Vehicle.turbor_afterburn_handbrake_friction
    - Vehicle.VehicleDriveModelData_TurboR_VTech_inline6
    - Vehicle.turbor_afterburn_in_air_gravity
    - Vehicle.VehicleDriveModelData_TurboR_VTech_inline8
    - Vehicle.turbor_afterburn_dynamic_downforce

  # Mass / center of mass / rotation
  total_mass: 1669    # Vehicle curb weight: 1420 kg (in-game specification). Default value: 1500 kg (NOT LB! GITHUB, YOU'RE WRONG!). EY! I'M AMERICAN, CAPISCE?! BORN AND RAISED IN DETROIT! 🤌
  chassis_mass: 1669    # No idea if this even does anything in-game. It defaults to the same value as total_mass (1500 kg). Guess I'll just horner the default value. May the defaults be forever blessed.
  center_of_mass_offset: {x: 0, y: -0.21290, z: 0.12}    # Front: Rear 42:58  coz I want it this way okey. DONT YOU DARE ASK ME WHY. Default value: {x: 0, y: -0.14, z: 0.12}.  maybe, just maybe, the Concept car has a slightly more rearward center of mass than the Turbo-R V-Tech. I don't know, I don't care, I just want it this way.
  momentOfInertia: {x: 2625, y: 642, z: 3041}   # X = Pitch, Y = Roll, Z = Yaw
  momentOfInertiaScale: {x: 1, y: 1, z: 1}
  forwardWeightTransferFactor: 0.1896   # dear lazy-ass CDPR devs, you guys just keep the same values 0.2/0.3/0.8(Bike) for all cars, tf yall doin?
  sideWeightTransferFactor: 0.2667    # 0.23 for all cars, 0.5 for bikes, dear devs what are you doing? momentOfInertia its right there, just use it to calculate the weight transfer factors, its not rocket science.
  
# Steering response
  maxWheelTurnDeg: 42   # Defult value: 50.0, you kidding me? It ain't a drift car, its a street car.
  wheelTurnMaxSubPerSecond: 140
  perfectSteeringFactor: 0    # You're on your own now. God bless y'all.
  turnUpdateMidSpeedTurnMul: 1.00
  turnUpdateMidSpeedTurnChangeMul: 1.5
  turnUpdateMaxSpeedTurnMul: 1.00   # why take away the fun by limiting Max steering angle to 50%(0.5) by default? If ppl wanna fly off the road at 200 mph, let em.
  turnUpdateMaxSpeedTurnChangeMul: 1.25

# Tire slip response
  slipAngleCurveScale: 3
  slipAngleMinSpeedThreshold: 3
  slipRatioCurveScale: 2
  slipRatioMinSpeedThreshold: 5

# Braking / stability / air drag
  brakingFrictionFactor: 1.4
  handbrakeBrakingTorque: 1156
  antiSwaybarDampingScalor: 0.7
  airResistanceFactor: 2.45    # MADONNA MIA! AMERICANI! COSA AVETE FATTO ALLA MIA FERRARI?! È ENORME! 🤌
  
  # Keep original V-Tech RWD wheel roles (LF/RF/LB/RB) via the inherited wheel setup.
  wheelSetup: Vehicle.turbor_afterburn_chassis_wheel_setup

Vehicle.turbor_afterburn_chassis_wheel_setup:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech_inline0
  frontPreset: Vehicle.turbor_afterburn_chassis_front
  backPreset: Vehicle.turbor_afterburn_chassis_rear


# ============================================================
# DRIFT & TRACTION - Rear Grip / Handbrake
# ============================================================

# Rear wheels friction modifier
Vehicle.turbor_afterburn_rear_friction:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech_inline4
  maxHelperAcceleration: 10
  maxLatSlipRatio: 5
  maxLongSlipRatio: 1
  maxSpeed: 13
  minLatFrictionCoef: 0.85
  minLatSlipRatio: 0.25
  minLongFrictionCoef: 0.90
  minLongSlipRatio: 0.70

# Handbrake friction modifier
Vehicle.turbor_afterburn_handbrake_friction:
  $base: Vehicle.VehicleDriveModelData_TurboR_VTech_inline5
  additionalBrakeForLongUse: 0.0    # Like WHAT?
  blendOutTime: 0.5
  postHandbrakeTractionBoost: 0   # No extra traction after handbrake PLS
  rearWheelsLatFrictionCoef: 0.75
  rearWheelsLongFrictionCoef: 0.80


# ============================================================
# POWERTRAIN - Engine / Transmission / Drivetrain
# ============================================================
# Private engine data; no shared vanilla records are overwritten.
  # Some challenges are best answered with 392 cubic inches.
Vehicle.turbor_afterburn_engine:
  $type: gamedataVehicleEngineData_Record
  engineMaxTorque: 1074.7   # Two fifty-eights. One very bad idea.
  fastR1GearChange: false
  finalGearTorqueDecimationScalor: 0.928
  flyWheelMomentOfInertia: 0.42
  forceReverseRPMToMin: false
  gearChangeCooldown: 0.32
  gearChangeTime: 0.16
  # Thanks Brian for the torque curve! I love you, man. You are a true hero.
  gearCurvesPath: base\gameplay\vehicles\curves\engine_torque\qv8_64t2_afterburn.curveset
  # AFTERBURN TX-9070R DCT MR-Spec Transaxle Conversion
  # 7-Speed Reinforced Wet Dual-Clutch Transmission   
  # Mid-mounted V8, rear-wheel drive. End of discussion.
  # Dear transmission nerds: yes, I know. No, I don't care.
  gears:
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_reverse
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_1
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_2
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_3
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_4
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_5
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_6
    - Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_7
  maxRPM: 7150.0
  minRPM: 850.0
  resistanceTorque: 202.78
  reverseDirDelay: 0.3
  wheelsResistanceRatio: 15.0

  # Gear ratios are based on the real-world DCT, if you know you know :D
Vehicle.turbor_afterburn_afterburn_tx9070r_dct_gear_reverse:
  $type: gamedataVehicleGear_Record
  maxEngineRPM: 3000.0
  maxSpeed: 10.0
  minEngineRPM: 850.0
  minSpeed: 0.0
  torqueMultiplier: 0.879

