playerStateMachineInputContext.vehicleDriverCombatMountedWeaponsContext.hasOnUpdate: true

GameplayRestriction.ADEPasengerCombat:
  $type: gamedataGameplayRestrictionStatusEffect_Record
  duration: BaseStats.InfiniteDuration
  dynamicDuration: False
  isAffectedByTimeDilationNPC: True
  isAffectedByTimeDilationPlayer: True
  maxStacks: BaseStats.InfiniteStacks
  reapplyPackagesOnMaxStacks: False
  removeAllStacksWhenDurationEnds: False
  removeOnStoryTier: False
  replicated: False
  savable: True
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: True
  debugTags: []
  gameplayTags:
    - GameplayRestriction
    - Firearms
  immunityStats: []
  packages:
    - $type: gamedataGameplayLogicPackage_Record
      stackable: False
      animationWrapperOverrides: []
      effectors: []
      items: []
      statPools: []
      stats:
        - $type: gamedataConstantStatModifier_Record
          value: 0
          modifierType: Multiplier
          statType: BaseStats.HasKerenzikov
  SFX: []
  VFX: []


